[package]
name = "dbd"
version = "0.4.0"
edition = "2021"

[dependencies]
dbd-core = { path = "../core" }
tokio.workspace = true
serde_json.workspace = true
anyhow.workspace = true
axum.workspace = true
futures-util.workspace = true
rand = "0.8"

[features]
# `cargo build -p dbd --features remote`: a headless device on a desktop that phones can use as a remote.
remote = ["dbd-core/remote"]
