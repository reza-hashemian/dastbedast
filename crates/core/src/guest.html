<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DastBeDast</title>
<!-- Added to a phone's home screen, the page opens on its own like an app. -->
<link rel="manifest" href="/g/{{TOKEN}}/manifest.webmanifest">
<link rel="apple-touch-icon" href="/g/{{TOKEN}}/icon.png">
<link rel="icon" href="/g/{{TOKEN}}/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DastBeDast">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAFCFD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15252E" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#EDF1F4;--surface:#FAFCFD;--sunk:#E1E8ED;--line:#CBD6DD;--ink:#12232E;--muted:#526773;--accent:#0A7486;--on:#fff;--soft:#D3EAEE;--ok:#1E8A55;--bad:#B3402F}
@media (prefers-color-scheme:dark){:root{--bg:#0D181E;--surface:#15252E;--sunk:#0F1D24;--line:#2A3F4B;--ink:#E4EEF2;--muted:#93A8B3;--accent:#45BFD2;--on:#06222A;--soft:#143A44;--ok:#4CC48A;--bad:#EE8572;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 Vazirmatn,Tahoma,-apple-system,"Segoe UI",sans-serif;
  padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));-webkit-text-size-adjust:100%}
main{max-width:520px;margin:auto;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:1.5rem;color:var(--accent);line-height:1.4}
h2{margin:0;font-size:1rem}
p{margin:0;color:var(--muted);font-size:.9rem}
section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
button,input{font:inherit;color:inherit}
.pick{display:block;text-align:center;background:var(--accent);color:var(--on);border-radius:10px;padding:12px;font-weight:700;cursor:pointer}
.pick:focus-within{outline:2px solid var(--ink);outline-offset:2px}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;background:var(--sunk)}
.seg button{border:0;background:none;border-radius:7px;font-size:.88rem;font-weight:700;padding:6px;min-height:40px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on)}
.line{display:flex;gap:8px}
.line input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 14px;font-weight:700;font-size:.88rem;white-space:nowrap;min-height:40px;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--on)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:.92rem}
ul li:first-child{border-top:0}
ul li>div{min-width:0;display:flex;flex-direction:column}
.nm{overflow-wrap:anywhere}
.txt{white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;-webkit-user-select:text;user-select:text}
.s{color:var(--muted);font-size:.8rem}
.st{color:var(--muted);white-space:nowrap;font-size:.84rem}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.tip{background:var(--soft);border-color:var(--accent)}
.tip p{color:var(--ink)}
.tip ol{margin:0;padding-inline-start:20px;font-size:.9rem}
.x{align-self:flex-end;background:none;border:0;color:var(--accent);font-weight:700;font-size:.84rem;padding:4px 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <div>
    <h1 id="t-brand"></h1>
    <p id="t-intro"></p>
  </div>

  <section class="tip" id="tip" hidden>
    <h2 id="t-tip-title"></h2>
    <ol id="tip-steps"></ol>
    <button class="x" type="button" id="tip-close"></button>
  </section>

  <section>
    <h2 id="t-send"></h2>
    <div class="seg" role="group">
      <button type="button" id="to-host" aria-pressed="true"></button>
      <button type="button" id="to-board" aria-pressed="false"></button>
    </div>
    <label class="pick"><span id="t-pick"></span><input id="pick" type="file" multiple></label>
    <ul id="ups"></ul>
  </section>

  <section>
    <h2 id="t-board"></h2>
    <div class="line"><input id="text" autocomplete="off"><button type="button" class="btn go" id="put"></button></div>
    <ul id="board"></ul>
  </section>

  <section id="for-you" hidden>
    <h2 id="t-for-you"></h2>
    <ul id="files"></ul>
  </section>
</main>
<span id="host" hidden>{{HOST}}</span>
<script>
var base = location.pathname.replace(/\/$/, '');
function $(id){return document.getElementById(id)}
// The page speaks the language chosen on the device that shows the link.
var EN = document.documentElement.lang === 'en', HOST = $('host').textContent;
document.documentElement.dir = EN ? 'ltr' : 'rtl';
var TX = EN ? {
  brand:'DastBeDast', intro:'Connected to “'+HOST+'”. This page works only on the same network.', send:'Send files', toHost:'To “'+HOST+'”', toBoard:'To the shared board', pick:'Choose files',
  board:'Shared board', boardPh:'Text or a link for all devices…', put:'Put', boardNone:'The board is empty.', from:'from ', copy:'Copy', copied:'Copied', away:'not on “'+HOST+'” yet', nFiles:' files',
  forYou:'Files put out for you', queued:'queued', ok:'sent', bad:'failed', lost:'connection lost', get:'Download', pct:'%', units:['B','KB','MB','GB'],
  tipTitle:'Keep it on your home screen', tipIos:['Tap the Share button at the bottom of Safari.','Choose “Add to Home Screen”.','Open DastBeDast from the home screen from now on.'],
  tipOther:['Open the browser menu.','Choose “Add to Home screen” or “Install”.'], tipClose:'Not now'
} : {
  brand:'دست‌به‌دست', intro:'به «'+HOST+'» وصل هستی. این صفحه فقط روی همان شبکه کار می‌کند.', send:'فرستادن فایل', toHost:'به «'+HOST+'»', toBoard:'روی میز مشترک', pick:'انتخاب فایل',
  board:'میز مشترک', boardPh:'متن یا لینک برای همهٔ دستگاه‌ها…', put:'بگذار', boardNone:'میز خالی است.', from:'از ', copy:'کپی', copied:'کپی شد', away:'هنوز روی «'+HOST+'» نیست', nFiles:' فایل',
  forYou:'فایل‌هایی که برایت گذاشته‌اند', queued:'در صف', ok:'فرستاده شد', bad:'نشد', lost:'اتصال قطع شد', get:'دریافت', pct:'٪', units:['بایت','کیلوبایت','مگابایت','گیگابایت'],
  tipTitle:'روی صفحهٔ اصلی گوشی نگهش دار', tipIos:['پایین Safari دکمهٔ Share (اشتراک‌گذاری) را بزن.','«Add to Home Screen» را انتخاب کن.','از این به بعد «دست‌به‌دست» را از صفحهٔ اصلی باز کن.'],
  tipOther:['منوی مرورگر را باز کن.','«Add to Home screen» یا «Install» را انتخاب کن.'], tipClose:'فعلاً نه'
};
[['t-brand','brand'],['t-intro','intro'],['t-send','send'],['to-host','toHost'],['to-board','toBoard'],['t-pick','pick'],['t-board','board'],['put','put'],['t-for-you','forYou'],['t-tip-title','tipTitle'],['tip-close','tipClose']]
  .forEach(function(p){$(p[0]).textContent=TX[p[1]]});
$('text').placeholder = TX.boardPh; $('text').setAttribute('aria-label', TX.boardPh);
document.title = TX.brand;

function size(n){var u=TX.units,i=0;while(n>=1024&&i<3){n/=1024;i++}return (i?n.toFixed(1):n)+' '+u[i]}
function el(tag, cls, text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}

// ---- adding to the home screen. A phone offers no way to do this for the user, so the steps are spelled out.
var standalone = navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var mobile = ios || /Android/.test(navigator.userAgent);
var dismissed = false; try { dismissed = localStorage.getItem('dbd-tip') === '1' } catch (e) {}
if (!standalone && mobile && !dismissed) {
  (ios ? TX.tipIos : TX.tipOther).forEach(function(s){ $('tip-steps').appendChild(el('li', null, s)) });
  $('tip').hidden = false;
}
$('tip-close').onclick = function(){ $('tip').hidden = true; try { localStorage.setItem('dbd-tip', '1') } catch (e) {} };

// ---- sending
var target = 'host';
function setTarget(t){ target = t; $('to-host').setAttribute('aria-pressed', t === 'host'); $('to-board').setAttribute('aria-pressed', t === 'board') }
$('to-host').onclick = function(){ setTarget('host') }; $('to-board').onclick = function(){ setTarget('board') };
var queue=[], busy=false;
function next(){
  if(busy||!queue.length)return; busy=true;
  var job=queue.shift(), x=new XMLHttpRequest();
  x.open('PUT', base+(job.board?'/board/up/':'/up/')+encodeURIComponent(job.file.name));
  x.upload.onprogress=function(e){ if(e.lengthComputable) job.st.textContent=Math.floor(e.loaded/e.total*100)+TX.pct };
  x.onload=function(){ var ok=x.status>=200&&x.status<300; job.st.textContent=ok?TX.ok:TX.bad; job.st.className='st '+(ok?'ok':'bad'); busy=false; if(job.board)refreshBoard(); next() };
  x.onerror=function(){ job.st.textContent=TX.lost; job.st.className='st bad'; busy=false; next() };
  x.send(job.file);
}
$('pick').onchange=function(){
  for(var i=0;i<this.files.length;i++){
    var f=this.files[i], li=el('li'), st=el('span','st',TX.queued);
    li.appendChild(el('span','nm',f.name+' · '+size(f.size))); li.appendChild(st);
    $('ups').appendChild(li); queue.push({file:f,st:st,board:target==='board'});
  }
  this.value=''; next();
};

// ---- shared board
function copy(text, btn){
  function done(){ btn.textContent = TX.copied; setTimeout(function(){ btn.textContent = TX.copy }, 1500) }
  // The clipboard API needs HTTPS, which a page on the local network does not have.
  var ta = el('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0;top:0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  try { document.execCommand('copy'); done() } catch (e) {} finally { ta.remove() }
}
var boardSeen = null;
function refreshBoard(){
  fetch(base+'/board').then(function(r){return r.json()}).then(function(list){
    var key = JSON.stringify(list); if (key === boardSeen) return; boardSeen = key;
    var ul=$('board'); ul.textContent='';
    if(!list.length){var li=el('li');li.appendChild(el('span','s',TX.boardNone));ul.appendChild(li);return}
    list.forEach(function(b){
      var li=el('li'), box=el('div'), act;
      if (b.kind === 'text') {
        var t=el('span','nm txt',b.text); t.dir='auto'; box.appendChild(t); box.appendChild(el('span','s',TX.from+b.from));
        act=el('button','btn go',TX.copy); act.type='button'; act.onclick=function(){ copy(b.text, act) };
      } else {
        box.appendChild(el('span','nm',b.name));
        box.appendChild(el('span','s',size(b.size)+(b.files>1?' · '+b.files+TX.nFiles:'')+' · '+TX.from+b.from+(b.here?'':' · '+TX.away)));
        if (b.here) { act=el('a','btn go',TX.get); act.href=base+'/board/dl/'+b.id }
      }
      li.appendChild(box); if (act) li.appendChild(act); ul.appendChild(li);
    });
  }).catch(function(){});
}
function putText(){
  var v=$('text').value.trim(); if(!v)return;
  fetch(base+'/board/text',{method:'POST',headers:{'content-type':'text/plain;charset=utf-8'},body:v}).then(function(r){ if(r.ok){ $('text').value=''; refreshBoard() } });
}
$('put').onclick=putText;
$('text').onkeydown=function(e){ if(e.key==='Enter') putText() };

// ---- files put out for this guest
function refreshFiles(){
  fetch(base+'/list').then(function(r){return r.json()}).then(function(list){
    $('for-you').hidden = !list.length;
    var ul=$('files'); ul.textContent='';
    list.forEach(function(f){
      var li=el('li'), a=el('a','btn go',TX.get); a.href=base+'/dl/'+f.idx;
      li.appendChild(el('span','nm',f.name+' · '+size(f.size))); li.appendChild(a); ul.appendChild(li);
    });
  }).catch(function(){});
}
function refresh(){ refreshBoard(); refreshFiles() }
refresh(); setInterval(refresh, 4000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) refresh() });
</script>
</body>
</html>
