<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DastBeDast</title>
<!-- Added to a phone's home screen, the page opens on its own like an app. -->
<link rel="manifest" href="/g/{{TOKEN}}/manifest.webmanifest">
<link rel="apple-touch-icon" href="/g/{{TOKEN}}/icon.png">
<link rel="icon" href="/g/{{TOKEN}}/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DastBeDast">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAFCFD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15252E" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#EDF1F4;--surface:#FAFCFD;--sunk:#E1E8ED;--line:#CBD6DD;--ink:#12232E;--muted:#526773;--accent:#0A7486;--on:#fff;--soft:#D3EAEE;--ok:#1E8A55;--bad:#B3402F}
@media (prefers-color-scheme:dark){:root{--bg:#0D181E;--surface:#15252E;--sunk:#0F1D24;--line:#2A3F4B;--ink:#E4EEF2;--muted:#93A8B3;--accent:#45BFD2;--on:#06222A;--soft:#143A44;--ok:#4CC48A;--bad:#EE8572;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 Vazirmatn,Tahoma,-apple-system,"Segoe UI",sans-serif;
  padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));-webkit-text-size-adjust:100%}
main{max-width:520px;margin:auto;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:1.5rem;color:var(--accent);line-height:1.4}
h2{margin:0;font-size:1rem}
p{margin:0;color:var(--muted);font-size:.9rem}
section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
button,input{font:inherit;color:inherit}
.pick{display:block;text-align:center;background:var(--accent);color:var(--on);border-radius:10px;padding:12px;font-weight:700;cursor:pointer}
.pick:focus-within{outline:2px solid var(--ink);outline-offset:2px}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;background:var(--sunk)}
.seg button{border:0;background:none;border-radius:7px;font-size:.88rem;font-weight:700;padding:6px;min-height:40px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on)}
.line{display:flex;gap:8px}
.line input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 14px;font-weight:700;font-size:.88rem;white-space:nowrap;min-height:40px;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--on)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:.92rem}
ul li:first-child{border-top:0}
ul li>div{min-width:0;display:flex;flex-direction:column}
.nm{overflow-wrap:anywhere}
.txt{white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;-webkit-user-select:text;user-select:text}
.s{color:var(--muted);font-size:.8rem}
.st{color:var(--muted);white-space:nowrap;font-size:.84rem}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.tip{background:var(--soft);border-color:var(--accent)}
.tip p{color:var(--ink)}
.tip ol{margin:0;padding-inline-start:20px;font-size:.9rem}
.x{align-self:flex-end;background:none;border:0;color:var(--accent);font-weight:700;font-size:.84rem;padding:4px 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.devs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.dev{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px;text-align:start;line-height:1.5;min-height:92px;cursor:pointer}
.dev:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.dev.off{opacity:.55;cursor:default}
.dev svg{width:26px;height:26px;color:var(--accent)}
.dev b{overflow-wrap:anywhere}
.dev .s{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--ok)}
.prog{height:4px;border-radius:4px;background:var(--sunk);overflow:hidden;direction:ltr;margin-top:4px}
.prog i{display:block;height:100%;background:var(--accent)}
.grow{flex:1;min-width:0}
</style>
</head>
<body>
<main>
  <div>
    <h1 id="t-brand"></h1>
    <p id="t-intro"></p>
  </div>

  <section class="tip" id="tip" hidden>
    <h2 id="t-tip-title"></h2>
    <ol id="tip-steps"></ol>
    <button class="x" type="button" id="tip-close"></button>
  </section>

  <section>
    <h2 id="t-devices"></h2>
    <p id="t-devices-hint"></p>
    <div class="devs" id="devs"></div>
    <ul id="acts"></ul>
  </section>

  <section>
    <h2 id="t-inbox"></h2>
    <ul id="files"></ul>
  </section>

  <section>
    <h2 id="t-board"></h2>
    <div class="line"><input id="text" autocomplete="off"><button type="button" class="btn go" id="put"></button></div>
    <label class="btn" style="justify-content:center;cursor:pointer"><span id="t-board-file"></span><input id="board-pick" type="file" multiple></label>
    <ul id="board"></ul>
  </section>
</main>
<span id="host" hidden>{{HOST}}</span>
<script>
var base = location.pathname.replace(/\/$/, '');
function $(id){return document.getElementById(id)}
// The page speaks the language chosen on the device that shows the link.
var EN = document.documentElement.lang === 'en', HOST = $('host').textContent;
document.documentElement.dir = EN ? 'ltr' : 'rtl';
var TX = EN ? {
  brand:'DastBeDast', intro:'Through “'+HOST+'”. Works while that device is on and you are on its network.',
  devices:'Devices', devicesHint:'Tap a device to send it files.', connected:'connected', offline:'not reachable', thisHost:'this link’s device',
  inbox:'Files for you', inboxNone:'Nothing yet. Files that are sent to this phone show up here.',
  board:'Shared board', boardPh:'Text or a link for all devices…', put:'Put', boardFile:'Put a file on the board', boardNone:'The board is empty.', from:'from ', copy:'Copy', copied:'Copied', away:'being fetched…', nFiles:' files',
  queued:'queued', uploading:'uploading ', ok:'sent', bad:'failed', lost:'connection lost', get:'Download', pct:'%', units:['B','KB','MB','GB'], to:' → ',
  st:{connecting:'connecting…', asking:'waiting for it to accept…', active:'sending ', waiting:'interrupted; continues when it is back', done:'sent', rejected:'declined', cancelled:'cancelled', failed:'failed'},
  tipTitle:'Keep it on your home screen', tipIos:['Tap the Share button at the bottom of Safari.','Choose “Add to Home Screen”.','Open DastBeDast from the home screen from now on.'],
  tipOther:['Open the browser menu.','Choose “Add to Home screen” or “Install”.'], tipClose:'Not now'
} : {
  brand:'دست‌به‌دست', intro:'از راه «'+HOST+'». تا وقتی آن دستگاه روشن است و روی شبکه‌اش هستی کار می‌کند.',
  devices:'دستگاه‌ها', devicesHint:'برای فرستادن فایل روی یک دستگاه بزن.', connected:'وصل', offline:'در دسترس نیست', thisHost:'دستگاهِ همین لینک',
  inbox:'فایل‌های رسیده برای تو', inboxNone:'هنوز چیزی نیست. فایل‌هایی که برای این گوشی فرستاده شوند اینجا می‌آیند.',
  board:'میز مشترک', boardPh:'متن یا لینک برای همهٔ دستگاه‌ها…', put:'بگذار', boardFile:'گذاشتن فایل روی میز', boardNone:'میز خالی است.', from:'از ', copy:'کپی', copied:'کپی شد', away:'در حال آماده‌شدن…', nFiles:' فایل',
  queued:'در صف', uploading:'در حال فرستادن ', ok:'فرستاده شد', bad:'نشد', lost:'اتصال قطع شد', get:'دریافت', pct:'٪', units:['بایت','کیلوبایت','مگابایت','گیگابایت'], to:' ← ',
  st:{connecting:'در حال اتصال…', asking:'منتظر تأیید گیرنده…', active:'در حال فرستادن ', waiting:'قطع شد؛ با برگشتن دستگاه ادامه پیدا می‌کند', done:'فرستاده شد', rejected:'رد شد', cancelled:'لغو شد', failed:'ناموفق'},
  tipTitle:'روی صفحهٔ اصلی گوشی نگهش دار', tipIos:['پایین Safari دکمهٔ Share (اشتراک‌گذاری) را بزن.','«Add to Home Screen» را انتخاب کن.','از این به بعد «دست‌به‌دست» را از صفحهٔ اصلی باز کن.'],
  tipOther:['منوی مرورگر را باز کن.','«Add to Home screen» یا «Install» را انتخاب کن.'], tipClose:'فعلاً نه'
};
[['t-brand','brand'],['t-intro','intro'],['t-devices','devices'],['t-devices-hint','devicesHint'],['t-inbox','inbox'],['t-board','board'],['put','put'],['t-board-file','boardFile'],['t-tip-title','tipTitle'],['tip-close','tipClose']]
  .forEach(function(p){$(p[0]).textContent=TX[p[1]]});
$('text').placeholder = TX.boardPh; $('text').setAttribute('aria-label', TX.boardPh);
document.title = TX.brand;

function size(n){var u=TX.units,i=0;while(n>=1024&&i<3){n/=1024;i++}return (i?n.toFixed(1):n)+' '+u[i]}
function el(tag, cls, text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
var ICON = {
  laptop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg>',
  desktop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M9 20h6M12 16v4"/></svg>'
};
function icon(k){ return ICON[k==='android'?'phone':k==='windows'?'desktop':'laptop'] }

// ---- adding to the home screen. A phone offers no way to do this for the user, so the steps are spelled out.
var standalone = navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var mobile = ios || /Android/.test(navigator.userAgent);
var dismissed = false; try { dismissed = localStorage.getItem('dbd-tip') === '1' } catch (e) {}
if (!standalone && mobile && !dismissed) {
  (ios ? TX.tipIos : TX.tipOther).forEach(function(s){ $('tip-steps').appendChild(el('li', null, s)) });
  $('tip').hidden = false;
}
$('tip-close').onclick = function(){ $('tip').hidden = true; try { localStorage.setItem('dbd-tip', '1') } catch (e) {} };

// ---- sending: every file goes to the device of this link first; for another device it is passed on from there
var queue=[], busy=false;
function enqueue(files, url, label, after){
  for(var i=0;i<files.length;i++){
    var f=files[i], li=el('li'), box=el('div','grow'), st=el('span','s',TX.queued), bar=el('span','prog'), fill=el('i');
    fill.style.width='0%'; bar.appendChild(fill);
    box.appendChild(el('span','nm',f.name+(label?TX.to+label:''))); box.appendChild(st); box.appendChild(bar);
    li.appendChild(box); $('acts').insertBefore(li, $('acts').firstChild);
    queue.push({file:f,st:st,fill:fill,bar:bar,li:li,url:url,after:after});
  }
  next();
}
function next(){
  if(busy||!queue.length)return; busy=true;
  var job=queue.shift(), x=new XMLHttpRequest();
  x.open('PUT', base+job.url+encodeURIComponent(job.file.name));
  x.upload.onprogress=function(e){ if(e.lengthComputable){ var p=Math.floor(e.loaded/e.total*100); job.st.textContent=TX.uploading+p+TX.pct; job.fill.style.width=p+'%' } };
  x.onload=function(){
    var ok=x.status>=200&&x.status<300; busy=false;
    job.bar.remove();
    if(!ok){ job.st.textContent=x.responseText||TX.bad; job.st.className='s bad' }
    else if(job.after==='relay'){ job.li.remove() }   // from here on the device of this link reports on it
    else { job.st.textContent=TX.ok; job.st.className='s ok' }
    refresh(); next();
  };
  x.onerror=function(){ job.bar.remove(); job.st.textContent=TX.lost; job.st.className='s bad'; busy=false; next() };
  x.send(job.file);
}
$('board-pick').onchange=function(){ enqueue(this.files, '/board/up/', TX.board); this.value='' };

// ---- shared board
function copy(text, btn){
  function done(){ btn.textContent = TX.copied; setTimeout(function(){ btn.textContent = TX.copy }, 1500) }
  // The clipboard API needs HTTPS, which a page on the local network does not have.
  var ta = el('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0;top:0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  try { document.execCommand('copy'); done() } catch (e) {} finally { ta.remove() }
}
function putText(){
  var v=$('text').value.trim(); if(!v)return;
  fetch(base+'/board/text',{method:'POST',headers:{'content-type':'text/plain;charset=utf-8'},body:v}).then(function(r){ if(r.ok){ $('text').value=''; refresh() } });
}
$('put').onclick=putText;
$('text').onkeydown=function(e){ if(e.key==='Enter') putText() };

// ---- drawing. Each part is redrawn only when it changed, so an open file picker or a selection is not disturbed.
var seen = {};
function changed(key, value){ var j=JSON.stringify(value); if(seen[key]===j) return false; seen[key]=j; return true }
function empty(ul, text){ var li=el('li'); li.appendChild(el('span','s',text)); ul.appendChild(li) }

function drawDevices(s){
  if(!changed('devs',[s.host,s.peers])) return;
  var box=$('devs'); box.textContent='';
  function card(name, kind, online, sub, url, label){
    var c=el(online?'label':'div','dev'+(online?'':' off'));
    c.innerHTML=icon(kind); c.appendChild(el('b',null,name));
    var st=el('span','s'); st.appendChild(el('span','dot'+(online?' on':''))); st.appendChild(el('span',null,sub)); c.appendChild(st);
    if(online){ var inp=el('input'); inp.type='file'; inp.multiple=true; inp.onchange=function(){ enqueue(this.files,url,label,url==='/up/'?'':'relay'); this.value='' }; c.appendChild(inp) }
    box.appendChild(c);
  }
  card(s.host.name, s.host.kind, true, TX.thisHost, '/up/', s.host.name);
  s.peers.forEach(function(p){ card(p.name, p.kind, p.online, p.online?TX.connected:TX.offline, '/to/'+p.id+'/', p.name) });
}
function drawRelays(s){
  if(!changed('relays',s.relays)) return;
  Array.prototype.slice.call(document.querySelectorAll('#acts li[data-relay]')).forEach(function(n){ n.remove() });
  s.relays.forEach(function(r){
    var li=el('li'), box=el('div','grow'); li.setAttribute('data-relay','1');
    var text=TX.st[r.state]||r.state; if(r.state==='active'&&r.total) text+=Math.floor(r.done/r.total*100)+TX.pct; if(r.error&&r.state!=='waiting') text+=' · '+r.error;
    box.appendChild(el('span','nm',r.name+TX.to+r.peer));
    box.appendChild(el('span','s '+(r.state==='done'?'ok':(r.state==='failed'||r.state==='rejected')?'bad':''),text));
    li.appendChild(box); $('acts').appendChild(li);
  });
}
function drawInbox(s){
  if(!changed('inbox',s.inbox)) return;
  var ul=$('files'); ul.textContent='';
  if(!s.inbox.length) return empty(ul, TX.inboxNone);
  s.inbox.forEach(function(f){
    var li=el('li'), a=el('a','btn go',TX.get); a.href=base+'/dl/'+f.idx;
    li.appendChild(el('span','nm',f.name+' · '+size(f.size))); li.appendChild(a); ul.appendChild(li);
  });
}
function drawBoard(s){
  if(!changed('board',s.board)) return;
  var ul=$('board'); ul.textContent='';
  if(!s.board.length) return empty(ul, TX.boardNone);
  s.board.forEach(function(b){
    var li=el('li'), box=el('div'), act;
    if (b.kind === 'text') {
      var t=el('span','nm txt',b.text); t.dir='auto'; box.appendChild(t); box.appendChild(el('span','s',TX.from+b.from));
      act=el('button','btn go',TX.copy); act.type='button'; act.onclick=function(){ copy(b.text, act) };
    } else {
      box.appendChild(el('span','nm',b.name));
      box.appendChild(el('span','s',size(b.size)+(b.files>1?' · '+b.files+TX.nFiles:'')+' · '+TX.from+b.from+(b.here||b.files>1?'':' · '+TX.away)));
      if (b.here) { act=el('a','btn go',TX.get); act.href=base+'/board/dl/'+b.id }
    }
    li.appendChild(box); if (act) li.appendChild(act); ul.appendChild(li);
  });
}
function refresh(){
  fetch(base+'/state').then(function(r){return r.json()}).then(function(s){ drawDevices(s); drawRelays(s); drawInbox(s); drawBoard(s) }).catch(function(){});
}
refresh(); setInterval(refresh, 2500);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) refresh() });
</script>
</body>
</html>
