name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee "$RUNNER_TEMP/ci.log"
      - name: Keep the log of a failed run
        if: failure()
        run: bash .github/keep-log.sh "test-${{ runner.os }}" "${{ github.token }}"

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app
      - uses: cargo-bins/cargo-binstall@main
      - name: Tauri CLI
        run: |
          set -o pipefail
          cargo binstall -y --locked "tauri-cli@^2" 2>&1 | tee "$RUNNER_TEMP/ci.log"
      - name: Headless daemon
        run: |
          set -o pipefail
          cargo build --release -p dbd 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Desktop app
        working-directory: app
        run: |
          set -o pipefail
          cargo tauri build --bundles ${{ matrix.bundles }} 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Collect
        run: |
          mkdir out
          find app/target/release/bundle -type f \( -name "*.deb" -o -name "*-setup.exe" \) -exec cp {} out/ \;
          if [ "$RUNNER_OS" = Windows ]; then cp target/release/dbd.exe out/dbd-windows-x64.exe; else cp target/release/dbd out/dbd-linux-amd64; fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: dastbedast-${{ runner.os }}
          path: out/*
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
      - name: Keep the log of a failed run
        if: failure()
        run: bash .github/keep-log.sh "desktop-${{ runner.os }}" "${{ github.token }}"
