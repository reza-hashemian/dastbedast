[workspace]
members = ["crates/core", "crates/daemon"]
resolver = "2"
# The desktop shell needs WebKitGTK to build, so it is kept out of the default workspace build.
exclude = ["app"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "json", "query"] }
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Crypto and hashing stay fast in debug builds.
[profile.dev.package."*"]
opt-level = 2
