[package]
name = "dastbedast"
version = "0.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dbd-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
