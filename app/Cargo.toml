[package]
name = "dastbedast"
version = "0.4.0"
edition = "2021"

[lib]
name = "dastbedast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dbd-core = { path = "../crates/core", features = ["remote"] }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
