[package]
name = "dastbedast"
version = "0.3.2"
edition = "2021"

[lib]
name = "dastbedast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dbd-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
